name: Build Release APK

# 打 Tag（如 v1.2.0）并推送时自动构建 APK 并发布到 GitHub Releases
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js static export
        run: npm run build
        env:
          # 可选：在仓库 Settings → Secrets 里配置后，自动用你的更新地址构建
          NEXT_PUBLIC_VERSION_CHECK_URL: ${{ secrets.NEXT_PUBLIC_VERSION_CHECK_URL }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor
        run: npx cap sync

      # 签名（可选）：在仓库 Settings → Secrets 配置以下四个密钥后，产物为已签名 APK；
      # 未配置时产物为未签名 APK，仅用于自测。
      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/app-release-key.jks
          fi

      - name: Create keystore.properties
        env:
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_PASSWORD" ]; then
            printf 'storeFile=app-release-key.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KS_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/keystore.properties
          fi

      - name: Build release APK
        run: cd android && ./gradlew assembleRelease

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
