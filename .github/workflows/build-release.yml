name: Build Release APK

# 打 Tag（如 v1.4.2）并推送时自动构建 APK 并上传到同版本 Release。
# 也可以在 Actions 页面手动运行（workflow_dispatch）：只构建 + 上传 artifact，不动 Release。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Capacitor CLI 要求 Node >=22
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js static export
        run: npm run build
        env:
          # 可选：在仓库 Settings → Secrets 里配置后，自动用你的更新地址构建
          NEXT_PUBLIC_VERSION_CHECK_URL: ${{ secrets.NEXT_PUBLIC_VERSION_CHECK_URL }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 项目 source/target 兼容级别为 21（与本地打包环境一致）
          java-version: 21

      - name: Set up Android SDK
        # 不用 android-actions/setup-android@v3：它会执行 `sdkmanager tools`，
        # 而 Google 已下线 tools 包，在 runner 自带的 cmdline-tools 16.0 上必然报
        # "Warning: Failed to find package 'tools'" 并以 exit code 1 失败（v1.4.1/v1.4.2 都是这么挂的）。
        # runner 镜像本身已带 Android SDK，这里只补齐项目需要的 platform / build-tools。
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | sort | tail -1)"
          echo "使用 sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Sync Capacitor
        run: npx cap sync

      # 签名（可选）：在仓库 Settings → Secrets 配置以下四个密钥后，产物为已签名 APK；
      # 未配置时产物为未签名 APK，仅用于自测。
      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/app-release-key.jks
          fi

      - name: Create keystore.properties
        env:
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_PASSWORD" ]; then
            printf 'storeFile=app-release-key.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KS_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/keystore.properties
          fi

      - name: Build release APK
        # Windows 提交的 gradlew 无执行位，先 chmod +x 再运行
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub Release
        # 只在推 Tag 时发布；手动运行不碰 Release。
        # 不启用 generate_release_notes：Release 说明是手写的，避免被自动生成的覆盖。
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
