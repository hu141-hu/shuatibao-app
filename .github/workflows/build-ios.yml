name: Build iOS App

# iOS 无法在 Windows 上编译，这里用 GitHub 的 macOS runner 出包。
# 触发：推 v* 标签，或手动 workflow_dispatch。
#
# 产物是**未签名**的 .ipa，只能用于：
#   1) 拿到 Mac 上用 Xcode 重新签名；
#   2) 用 Sideloadly / AltStore 等工具，用你自己的 Apple ID 自签后装到设备上（7 天有效期）。
# 想要正式分发的 .ipa，需要 Apple Developer 账号（$99/年）+ 发布证书，见 docs/iOS打包说明.md。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js static export
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned app
        run: |
          cd ios/App
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify bundled web assets
        run: |
          APP="ios/App/build/Build/Products/Release-iphoneos/App.app"
          test -f "$APP/public/index.html"
          test -f "$APP/public/profile/index.html"
          echo "web assets ok"

      - name: Package unsigned ipa
        run: |
          cd ios/App/build/Build/Products/Release-iphoneos
          mkdir -p Payload
          cp -R App.app Payload/
          zip -qry "刷题宝-unsigned.ipa" Payload
          ls -lh "刷题宝-unsigned.ipa"

      - name: Upload ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: shuatibao-ios-unsigned
          path: ios/App/build/Build/Products/Release-iphoneos/刷题宝-unsigned.ipa
          if-no-files-found: error
